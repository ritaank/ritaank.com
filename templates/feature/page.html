{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ config.title }}{% endblock title %}
{% block description %}{% if page.description %}{{ page.description }}{% endif %}{% endblock description %}

{% block content %}
<article class="feature-page">
  <h1>{{ page.title }}</h1>
  <div class="feature-body">
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}
